<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cine App - Pruebas API</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff8f0; margin: 0; }
        h1 { text-align: center; padding: 20px; color: #4a3f35; }
        .tabs { display: flex; background: #ffd6ba; }
        .tab {
            flex: 1; padding: 15px; text-align: center;
            cursor: pointer; font-weight: bold;
        }
        .tab.active { background: #ffa980; color: white; }
        .content { display: none; padding: 20px; }
        .content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        th { background: #ffd6ba; }
        button { padding: 6px 12px; background: #ffa980; border: none; color: white; cursor: pointer; }
        button:hover { background: #ff7a50; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

<h1>🎬 Cine App – Pruebas API</h1>

<div class="tabs">
    <div class="tab active" onclick="abrirTab(0)">Asistentes</div>
    <div class="tab" onclick="abrirTab(1)">Películas</div>
    <div class="tab" onclick="abrirTab(2)">Salas</div>
    <div class="tab" onclick="abrirTab(3)">Proyecciones</div>
    <div class="tab" onclick="abrirTab(4)">Comprar Entrada</div>
</div>

<div class="content active">
    <h2>Asistentes</h2>
    <button onclick="listarAsistentes()">Listar</button>
    <table>
        <thead><tr><th>ID</th><th>Nombre</th></tr></thead>
        <tbody id="asistentes"></tbody>
    </table>
</div>

<div class="content">
    <h2>Películas</h2>
    <button onclick="listarPeliculas()">Listar</button>
    <table>
        <thead><tr><th>ID</th><th>Título</th><th>Género</th></tr></thead>
        <tbody id="peliculas"></tbody>
    </table>
</div>

<div class="content">
    <h2>Salas</h2>
    <button onclick="listarSalas()">Listar</button>
    <table>
        <thead><tr><th>ID</th><th>Número</th><th>Capacidad</th></tr></thead>
        <tbody id="salas"></tbody>
    </table>
</div>

<div class="content">
    <h2>Proyecciones</h2>
    <button onclick="listarProyecciones()">Listar</button>
    <table>
        <thead>
        <tr><th>ID</th><th>Película</th><th>Sala</th><th>Fecha</th><th>Hora</th></tr>
        </thead>
        <tbody id="proyecciones"></tbody>
    </table>
</div>

<div class="content">
    <h2>Comprar Entrada</h2>

    <label>Asistente ID:
        <input type="number" id="asistenteId">
    </label><br><br>

    <label>Proyección:
        <select id="proyeccionSelect" onchange="cargarButacas()"></select>
    </label><br><br>

    <label>Butaca:
        <select id="butacaSelect"></select>
    </label><br><br>

    <label>Precio:
        <input type="number" id="precio" value="8.5" step="0.5">
    </label><br><br>

    <button onclick="comprarEntrada()">Comprar</button>
    <p id="mensaje"></p>
</div>

<script>
    const api = "http://localhost:8080";

    function abrirTab(i) {
        document.querySelectorAll(".tab").forEach((t,idx)=>t.classList.toggle("active", idx===i));
        document.querySelectorAll(".content").forEach((c,idx)=>c.classList.toggle("active", idx===i));
    }

    function listarAsistentes() {
        fetch(`${api}/asistentes`)
            .then(r=>r.json())
            .then(data=>{
                document.getElementById("asistentes").innerHTML =
                    data.map(a=>`<tr><td>${a.idAsistente}</td><td>${a.nombre}</td></tr>`).join("");
            });
    }

    function listarPeliculas() {
        fetch(`${api}/peliculas`)
            .then(r=>r.json())
            .then(data=>{
                document.getElementById("peliculas").innerHTML =
                    data.map(p=>`<tr><td>${p.idPelicula}</td><td>${p.titulo}</td><td>${p.genero}</td></tr>`).join("");
            });
    }

    function listarSalas() {
        fetch(`${api}/salas`)
            .then(r=>r.json())
            .then(data=>{
                document.getElementById("salas").innerHTML =
                    data.map(s=>`<tr><td>${s.idSala}</td><td>${s.numero}</td><td>${s.capacidad}</td></tr>`).join("");
            });
    }

    function listarProyecciones() {
        fetch(`${api}/proyecciones`)
            .then(r=>r.json())
            .then(data=>{
                document.getElementById("proyecciones").innerHTML =
                    data.map(p=>`
                        <tr>
                            <td>${p.idProyeccion}</td>
                            <td>${p.pelicula.titulo}</td>
                            <td>Sala ${p.sala.numero}</td>
                            <td>${p.fecha}</td>
                            <td>${p.horario}</td>
                        </tr>`).join("");

                document.getElementById("proyeccionSelect").innerHTML =
                    data.map(p=>`
                        <option value="${p.idProyeccion}">
                            ${p.pelicula.titulo} (${p.fecha} ${p.horario})
                        </option>`).join("");

                cargarButacas();
            });
    }

    function cargarButacas() {
        const id = document.getElementById("proyeccionSelect").value;
        fetch(`${api}/entradas/libres?idProyeccion=${id}`)
            .then(r=>r.json())
            .then(data=>{
                document.getElementById("butacaSelect").innerHTML =
                    data.map(b=>`<option value="${b.idButaca}">${b.posicion}</option>`).join("");
            });
    }

    function comprarEntrada() {
        const a = asistenteId.value;
        const p = proyeccionSelect.value;
        const b = butacaSelect.value;
        const pr = precio.value;

        fetch(`${api}/entradas/comprar?idAsistente=${a}&idProyeccion=${p}&idButaca=${b}&precio=${pr}`, {
            method:"POST"
        })
        .then(r=>{
            if(!r.ok) throw new Error();
            return r.json();
        })
        .then(()=>{
            mensaje.textContent = "✅ Entrada comprada";
            mensaje.className = "success";
            cargarButacas();
        })
        .catch(()=>{
            mensaje.textContent = "❌ No se pudo comprar (regla de negocio)";
            mensaje.className = "error";
        });
    }

    window.onload = listarProyecciones;
</script>

</body>
</html>
