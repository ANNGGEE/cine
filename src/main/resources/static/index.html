<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Sistema de Gestión de Cine</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { color: #5555cc; }
        button { margin: 5px 0; }
        .section { margin-bottom: 30px; }
        .list-item { margin-left: 15px; }
    </style>
</head>
<body>

<h1>🎬 Sistema de Gestión de Cine</h1>

<!-- Asistentes -->
<div class="section">
    <h2>👤 Asistentes</h2>
    <button id="btnListarAsistentes">Listar asistentes</button>
    <ul id="listaAsistentes"></ul>
</div>

<!-- Películas -->
<div class="section">
    <h2>🎥 Películas</h2>
    <button id="btnListarPeliculas">Listar películas</button>
    <ul id="listaPeliculas"></ul>
</div>

<!-- Proyecciones -->
<div class="section">
    <h2>🎞️ Proyecciones</h2>
    <button id="btnListarProyecciones">Listar proyecciones</button>
    <ul id="listaProyecciones"></ul>
</div>

<!-- Salas -->
<div class="section">
    <h2>🏟️ Salas</h2>
    <button id="btnListarSalas">Listar salas</button>
    <ul id="listaSalas"></ul>
</div>

<!-- Butacas por sala -->
<div class="section">
    <h2>🪑 Butacas por sala</h2>
    <input type="number" id="inputIdSala" placeholder="ID Sala" />
    <button id="btnListarButacas">Listar butacas</button>
    <ul id="listaButacas"></ul>
</div>

<script>
    // Helper para limpiar listas
    function limpiarLista(id) {
        document.getElementById(id).innerHTML = '';
    }

    // Helper para mostrar error
    function mostrarError(id, error) {
        const contenedor = document.getElementById(id);
        contenedor.innerHTML = `<li style="color:red;">Error: ${error}</li>`;
    }

    // Listar asistentes
    document.getElementById('btnListarAsistentes').addEventListener('click', () => {
        limpiarLista('listaAsistentes');
        fetch('/asistentes')
            .then(res => res.json())
            .then(data => {
                const ul = document.getElementById('listaAsistentes');
                data.forEach(a => {
                    const li = document.createElement('li');
                    li.textContent = `${a.nombre} (ID: ${a.idAsistente})`;
                    ul.appendChild(li);
                });
            })
            .catch(err => mostrarError('listaAsistentes', err));
    });

    // Listar películas
    document.getElementById('btnListarPeliculas').addEventListener('click', () => {
        limpiarLista('listaPeliculas');
        fetch('/peliculas')
            .then(res => res.json())
            .then(data => {
                const ul = document.getElementById('listaPeliculas');
                data.forEach(p => {
                    const li = document.createElement('li');
                    li.textContent = `${p.titulo} (${p.anio}) - ID: ${p.idPelicula}`;
                    ul.appendChild(li);
                });
            })
            .catch(err => mostrarError('listaPeliculas', err));
    });

    // Listar proyecciones
    document.getElementById('btnListarProyecciones').addEventListener('click', () => {
        limpiarLista('listaProyecciones');
        fetch('/proyecciones')
            .then(res => res.json())
            .then(data => {
                const ul = document.getElementById('listaProyecciones');
                data.forEach(p => {
                    const fecha = p.fecha; // suponiendo campo fecha
                    const hora = p.horario; // suponiendo campo horario
                    const salaId = p.sala ? p.sala.idSala : 'N/A';
                    const peliculaTitulo = p.pelicula ? p.pelicula.titulo : 'N/A';
                    const li = document.createElement('li');
                    li.textContent = `ID: ${p.idProyeccion} - ${peliculaTitulo} - Sala: ${salaId} - Fecha: ${fecha} ${hora}`;
                    ul.appendChild(li);
                });
            })
            .catch(err => mostrarError('listaProyecciones', err));
    });

    // Listar salas
    document.getElementById('btnListarSalas').addEventListener('click', () => {
        limpiarLista('listaSalas');
        fetch('/salas')
            .then(res => res.json())
            .then(data => {
                const ul = document.getElementById('listaSalas');
                data.forEach(s => {
                    const li = document.createElement('li');
                    li.textContent = `Sala ID: ${s.idSala} - Nombre: ${s.nombre || 'Sin nombre'}`;
                    ul.appendChild(li);
                });
            })
            .catch(err => mostrarError('listaSalas', err));
    });

    // Listar butacas por sala
    document.getElementById('btnListarButacas').addEventListener('click', () => {
        limpiarLista('listaButacas');
        const idSala = document.getElementById('inputIdSala').value;
        if (!idSala) {
            mostrarError('listaButacas', 'Debe ingresar un ID de sala');
            return;
        }
        fetch(`/butacas/sala/${idSala}`)
            .then(res => {
                if (!res.ok) throw new Error(`Error HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                const ul = document.getElementById('listaButacas');
                data.forEach(b => {
                    const li = document.createElement('li');
                    li.textContent = `Butaca ID: ${b.idButaca} - Fila: ${b.fila} - Número: ${b.numero}`;
                    ul.appendChild(li);
                });
            })
            .catch(err => mostrarError('listaButacas', err));
    });
</script>

</body>
</html>
